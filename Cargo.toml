[package]
name = "quickserve"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.13.0"
clap = { version = "4.6.1", features = ["derive"] }
colored = "3.1.1"
tokio = { version = "1.52.3", features = ["fs"] }
tokio-util = "0.7.18"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = false
strip = "symbols"